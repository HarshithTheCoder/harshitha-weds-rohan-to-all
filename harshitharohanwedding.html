.seal:hover{transform:translate(-50%,-50%) scale(1.03)}
.seal:focus-visible{outline:3px solid var(--hint);outline-offset:4px}
.open .seal{transform:translate(-50%,-60%) scale(.85);opacity:0;pointer-events:none}
.hint{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--hint);text-align:center;margin:0;min-height:3.2em;transition:opacity .4s}
.hint .chev{display:block;margin:6px auto 0;width:14px;height:14px;border-right:2px solid var(--hint);border-bottom:2px solid var(--hint);transform:rotate(45deg);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{translate:0 6px}}

/* ---------- cards ---------- */
.cards{display:none;padding:12px 16px 80px}
.opened .cards{display:block}
.card{max-width:430px;margin:0 auto 24px;background:var(--paper);padding:14px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.inner{border:1px solid var(--accent);outline:1px solid var(--accent);outline-offset:-5px;padding:30px 22px 22px;text-align:center}
@media (max-width:420px){.inner{padding:26px 12px 18px}.card{padding:10px}.card .s{font-size:.93rem}}
.card p{margin:0 0 .7em;line-height:1.35;font-size:1.06rem}
.card .s{font-style:italic;font-size:.98rem}
.card .verse{font-style:italic;font-size:.92rem}
.card .ref{display:block;font-size:.8rem;margin-top:2px}
.card .em{color:var(--maroon);font-weight:600}
.card .parents{font-family:var(--script);font-size:1.75rem;color:var(--maroon);margin:.15em 0 .1em;line-height:1.1}
.card .who{font-family:var(--script);font-size:2.6rem;color:var(--maroon);line-height:1.05;margin:0}
.card .with{font-style:italic;font-size:.95rem;margin:.1em 0}
.card .event{font-family:var(--script);font-size:2.2rem;color:var(--maroon);line-height:1.1;margin:.1em 0 .3em}
.card .gap{margin-top:1em}
.card sup{font-size:.6em}
.card .stamp{width:58px;margin:10px auto 0;display:block}
.cross{display:block;margin:0 auto 10px;width:12px;height:18px}
.end{text-align:center;color:var(--hint);font-style:italic;font-size:1.1rem;margin:0 0 20px}
@media (prefers-reduced-motion: reduce){ .flap,.flap::after,.seal,.leaf,.cover{transition:none!important} .hint .chev{animation:none} }
.cards{padding:0}
.spread{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;max-width:none;margin:0;padding:0;background:none;box-shadow:none}
.pair{display:grid;grid-template-columns:1fr 1fr;width:min(900px,92vw,calc((100svh - 56px)*1.5));box-shadow:0 14px 34px rgba(0,0,0,.5)}
.half img{display:block;width:100%;height:auto}
@media (max-width:719px){
  .spread{display:block;min-height:0}
  .pair{display:block;width:auto;box-shadow:none}
  .half{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center}
  .half img{width:min(92vw,calc((100svh - 40px)*.75));box-shadow:0 14px 34px rgba(0,0,0,.5)}
}
</style>

<script>
(function(){
  var seal=document.getElementById('seal'),packet=document.getElementById('packet'),hint=document.getElementById('hint');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running=false,paused=false,idleTimer=null,dwellTimer=null,anim=null;
  function stops(){
    var wide=window.innerWidth>=720;
    return Array.prototype.slice.call(document.querySelectorAll(wide?'.spread':'.half')).map(function(el){
      var y=el.getBoundingClientRect().top+window.scrollY;
      var d=wide?Math.max.apply(null,[].map.call(el.querySelectorAll('img'),function(i){return +i.dataset.dwell||5000;})):(+el.querySelector('img').dataset.dwell||5000);
      return {y:Math.max(0,Math.round(y)),dwell:d};
    });
  }
  function glide(to,dur,done){
    if(reduce){window.scrollTo(0,to);done();return;}
    var from=window.scrollY,dist=to-from,t0=null;
    function step(ts){
      if(paused)return; if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      window.scrollTo(0,from+dist*e);
      if(p<1)anim=requestAnimationFrame(step); else done();
    }
    anim=requestAnimationFrame(step);
  }
  function next(){
    if(paused)return;
    var list=stops(),cur=window.scrollY,s=null;
    for(var i=0;i<list.length;i++){ if(list[i].y>cur+8){s=list[i];break;} }
    if(!s){running=false;return;}
    glide(s.y,1500,function(){ dwellTimer=setTimeout(next,s.dwell); });
  }
  function interrupt(){
    if(!running)return;
    paused=true; cancelAnimationFrame(anim); clearTimeout(dwellTimer); clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){paused=false;next();},8000);
  }
  ['wheel','touchstart','keydown','mousedown'].forEach(function(ev){window.addEventListener(ev,interrupt,{passive:true});});
  seal.addEventListener('click',function(){
    packet.classList.add('open');
    hint.style.opacity=0;
    setTimeout(function(){
      packet.classList.add('gone');
      document.body.classList.remove('locked');
      document.body.classList.add('opened');
      setTimeout(function(){running=true;next();}, reduce?0:900);
    }, reduce?0:1900);
  });
})();
</script>
